    <button class="actu-filter" data-filtre="evenement">Événements</button>
  </div>

  <div class="actu-grid" id="actu-grid"></div>

</section>
</main>

<footer>

    <div class="footer-bottom" style="border-top:none;padding-top:0;">
      <span>© 2026 Dynamique Bapa de Libreville</span>

    </div>
  </div>
</footer>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="nav-common.js"></script>

let filtreCourant = 'tous';

function renderActus(filtre) {
  const grid = document.getElementById('actu-grid');
  grid.innerHTML = '';
  const liste = filtre === 'tous' ? ACTUS : ACTUS.filter(a => a.cat === filtre);
  if (liste.length === 0) {
    grid.innerHTML = '<p style="color:var(--muted);font-size:14px;">Aucune actualité dans cette catégorie pour le moment.</p>';
    return;
  }
  liste.forEach((a, i) => {
    const el = document.createElement('div');
    el.className = 'actu-card';
    el.setAttribute('data-aos', 'fade-up');
    el.setAttribute('data-aos-delay', String((i % 3) * 60));
    el.innerHTML = `
      <div class="actu-card-img">
        <img src="${a.img}" alt="${a.titre}" loading="lazy"/>
        <span class="actu-card-tag">${a.catLabel}</span>
      </div>
      <div class="actu-card-body">
        <div class="actu-meta">${a.date}</div>
        <h3>${a.titre}</h3>
        <p>${a.texte}</p>
      </div>
    `;
    grid.appendChild(el);
  });
  AOS.refreshHard();
}

function filterActu(filtre) {
  filtreCourant = filtre;
  document.querySelectorAll('.actu-filter').forEach(b => {
    b.classList.toggle('active', b.dataset.filtre === filtre);
  });
  renderActus(filtre);
}

document.querySelectorAll('.actu-filter').forEach(btn => {
  btn.addEventListener('click', () => filterActu(btn.dataset.filtre));
});

renderActus('tous');
initNav('actualites');
AOS.init({ once: true, offset: 50, duration: 650 });
</script>
</body>
</html>
